[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-toolkit-gtk3"
version = "1.0.0"
description = "A GTK3 Toolkit for writing Sugar activities in Python"
readme = "README.md"
license = { text = "LGPL-2.1-or-later" }
authors = [
    { name = "Sugar Labs Community", email = "sugar-devel@lists.sugarlabs.org" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.8"

dependencies = [
    "PyGObject>=3.42.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autoapi>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/sugarlabs/sugar-toolkit-gtk3"
Repository = "https://github.com/sugarlabs/sugar-toolkit-gtk3.git"
Issues = "https://github.com/sugarlabs/sugar-toolkit-gtk3/issues"

[project.scripts]
bundlebuilder = "sugar3.activity.bundlebuilder:start"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
